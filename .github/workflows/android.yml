name: Build MiLove APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Capacitor and Generate Assets
        run: |
          npx cap add android || true
          npm run cap:sync
          npm run cap:assets

      - name: Generate Keystore
        run: npm run cap:keystore

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          # Find apksigner in Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          echo "Using apksigner at: $APKSIGNER"
          # Sign the generated APK using the keystore created in the previous step
          $APKSIGNER sign --ks my-release-key.jks \
            --ks-key-alias my-key-alias \
            --ks-pass pass:milove123 \
            --key-pass pass:milove123 \
            --out android/app/build/outputs/apk/release/milove-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: milove-release-apk
          path: android/app/build/outputs/apk/release/milove-signed.apk
